<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Illustration : conférence">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a6b" />
      <stop offset="0.55" stop-color="#e0491c" />
      <stop offset="1" stop-color="#b8320d" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Ondes sonores partant du pupitre -->
  <g fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="14" stroke-linecap="round">
    <path d="M545 225a120 120 0 0 0-120-120" />
    <path d="M615 225a190 190 0 0 0-190-190" />
    <path d="M545 225a120 120 0 0 1-120 120" />
    <path d="M615 225a190 190 0 0 1-190 190" />
  </g>

  <!-- Rangée de sièges -->
  <g fill="#fff" fill-opacity=".16">
    <rect x="90" y="340" width="70" height="46" rx="12" />
    <rect x="176" y="340" width="70" height="46" rx="12" />
    <rect x="262" y="340" width="70" height="46" rx="12" />
  </g>

  <!-- Micro sur pied -->
  <g fill="#fff" fill-opacity=".92">
    <rect x="196" y="150" width="44" height="86" rx="22" />
    <path d="M176 214a42 42 0 0 0 84 0" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" />
    <rect x="212" y="252" width="12" height="52" rx="6" />
