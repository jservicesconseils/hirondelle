<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Hirondelle</title>
        <base href="/" />
        <!-- `viewport-fit=cover` : sans lui, la zone sous la barre système (Android 15
             et son affichage bord à bord par défaut) reste hors du viewport que la page
             connaît. `inset: 0`/`100vh` s'arrêtent alors avant le vrai bas de l'écran,
             laissant un bandeau non peint où le fond par défaut du WebView (blanc)
             transparaît — le vide constaté sous la barre de navigation mobile. -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
        <link rel="icon" type="image/svg+xml" href="favicon.svg" />
        <link href="https://fonts.cdnfonts.com/css/lato" rel="stylesheet" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </head>

    <body>
        <app-root></app-root>
    </body>
</html>
