<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [closable]="false"
  [style]="{ width: '600px' }"
  header="CONFIRMATION D'IMPORTATION"
>
  <!-- 🔴 MODIFIÉ : condition ajoutée pour exclure le cas showSuccessMessage -->
  <ng-container *ngIf="!loading && !showSuccessMessage">
    <p class="nombre-ligne">Êtes-vous sûr de vouloir importer ces {{ previewData.length }} contacts ?</p>
    <div class="p-dialog-footer">
      <button pButton label="Annuler" icon="pi pi-times" class="p-button-secondary" (click)="cancel.emit()"></button>
      <button pButton label="Oui! Importer" icon="pi pi-upload" class="p-button-primary" (click)="confirm.emit()"></button>
    </div>
  </ng-container>

  <!-- 🔴 INCHANGÉ : Importation en cours -->
  <ng-container *ngIf="loading">
    <p>Importation en cours...</p>
    <p-progressBar [value]="progress"></p-progressBar>
    <p class="text-center mt-2">{{ progress }}%</p>
  </ng-container>

  <!-- 🔴 AJOUTÉ : Message succès -->
  <ng-container *ngIf="showSuccessMessage">
    <p class="success-message text-center">
      ✅ Importation de <strong>{{ previewData.length }}</strong> contact(s) effectuée avec succès !
    </p>
    <div class="p-dialog-footer text-center mt-3">
      <button
        pButton
        label="Fermer"
        icon="pi pi-check"
        class="p-button-success"
        (click)="cancel.emit()"
      ></button>
    </div>
  </ng-container>
</p-dialog>
