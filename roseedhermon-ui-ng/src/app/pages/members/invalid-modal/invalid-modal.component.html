<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '700px' }"
  header="Lignes invalides détectées"
  (onHide)="close.emit()"
>
<!-- <div class="modal-header">
    <h2 class="modal-title">Lignes invalides détectées</h2>
  </div> -->
  <p  class="nombre-ligne">Nombre de lignes invalides détectées: {{ total }} </p>

  <p-table
    [value]="invalidRows"
    [scrollable]="true"
    scrollHeight="300px"
    responsiveLayout="scroll"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Ligne Excel</th>
        <th>Champs manquants</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td>{{ row.rowNumber }}</td>
        <td>{{ row.missingFields.join(', ') }}</td>
      </tr>
    </ng-template>
  </p-table>

  <div class="p-dialog-footer">
    <button pButton type="button" label="Fermer" icon="pi pi-times" class="p-button-danger" (click)="close.emit()"></button>
  </div>
</p-dialog>
