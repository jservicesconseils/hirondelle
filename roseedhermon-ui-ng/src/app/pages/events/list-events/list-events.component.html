<div class="container">
  <div class="toolbar">
    <div class="filter-section">
      <div class="filter-item">
        <label for="eventNameFilter">Événement</label>
        <p-autoComplete
          id="eventNameFilter"
          [(ngModel)]="eventNameFilter"
          [suggestions]="eventNameSuggestions"
          (completeMethod)="filterEventName($event)"
          (onSelect)="onEventNameSelect($event)"
          (onClear)="onEventNameClear()"
          (input)="onEventNameChange()"
          placeholder="Filtrer par événement..."
          [dropdown]="true"
          [showClear]="true"
          class="filter-autocomplete">
        </p-autoComplete>
      </div>
      <div class="filter-item">
        <label for="placeFilter">Lieu</label>
        <p-autoComplete
          id="placeFilter"
          [(ngModel)]="placeFilter"
          [suggestions]="placeSuggestions"
          (completeMethod)="filterPlace($event)"
          (onSelect)="onPlaceSelect($event)"
          (onClear)="onPlaceClear()"
          (input)="onPlaceChange()"
          placeholder="Filtrer par lieu..."
          [dropdown]="true"
          [showClear]="true"
          class="filter-autocomplete">
        </p-autoComplete>
      </div>
      <div class="filter-item">
        <label for="cityFilter">Ville</label>
        <p-autoComplete
          id="cityFilter"
          [(ngModel)]="cityFilter"
          [suggestions]="citySuggestions"
          (completeMethod)="filterCity($event)"
          (onSelect)="onCitySelect($event)"
          (onClear)="onCityClear()"
          (input)="onCityChange()"
          placeholder="Filtrer par ville..."
          [dropdown]="true"
          [showClear]="true"
          class="filter-autocomplete">
        </p-autoComplete>
      </div>
    </div>
    <button pButton
            icon="pi pi-plus-circle"
            label="Créer un événement"
            class="p-button-success wide-btn"
            (click)="showCreateEventDialog()">
    </button>
  </div>
  <div [class.reduced]="selectedEvent" class="grid-section">
    <ag-grid-angular
      style="width: 100%; height: calc(100vh - 300px); min-height: 500px;"
      class="ag-theme-alpine"
      [rowData]="filteredEventList"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [gridOptions]="gridOptions"
      [pagination]="true"
      [theme]="'legacy'"
      [paginationPageSize]="paginationPageSize"
      (rowClicked)="onRowClicked($event)"
      [suppressColumnVirtualisation]="true"
      [suppressHorizontalScroll]="true"
    >
    </ag-grid-angular>
  </div>

  <div *ngIf="selectedEvent" class="detail-panel">
    <app-detail-event
      [event]="selectedEvent"
      (close)="onCloseDetail()"
      (editEvent)="onEditEvent($event)"
    ></app-detail-event>
  </div>

  <app-create-event #createEvent></app-create-event>
  <app-create-event 
    *ngIf="editEventVisible"
    [visible]="editEventVisible"
    [eventToEdit]="eventToEdit"
    (close)="closeEditEvent()"
  ></app-create-event>
</div>
