<span class="scroll-sentinel" #sentinel aria-hidden="true"></span>

<header class="topbar" [class.is-scrolled]="scrolled">
  <div class="shell topbar-inner">
    <a class="brand" routerLink="/web">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M21 4c-4.2.5-7.4 2.2-9.6 5.1C9.6 11.6 8.6 14.6 8.3 18l-2.6 3h3.5c.4-2.9 1.2-5.3 2.6-7.2 1.9-2.6 4.7-4.1 8.2-4.6L21 4z"
            fill="currentColor" />
        </svg>
      </span>
      <span class="brand-text">Hirondelle</span>
    </a>

    <nav class="topbar-nav" [class.is-open]="menuOpen">
      <button type="button" (click)="goTo('evenements')">Événements</button>
      <button type="button" (click)="goTo('categories')">Catégories</button>
      <button type="button" (click)="goTo('organiser')">Organiser</button>
      <button type="button" (click)="goTo('apropos')">À propos</button>
      <!-- Un administrateur (groupe ou super) a sa place dans la barre, au même
           titre que les liens marketing : son tableau de bord réunit déjà
           « Mes événements » et « Membres », inutile de les répéter ici. -->
      <a class="nav-link nav-link--primary" *ngIf="auth.canAdminister()" routerLink="/app/dashboard">Mon espace</a>
      <!--
        Ces deux entrées ne concernent que les comptes sans Mon espace ; elles
        vivent dans le menu du compte en desktop (voir .account-dropdown) et
        réapparaissent ici dans le menu mobile déplié, où l'espace ne manque pas.
      -->
      <!-- Agenda personnel : dès qu'une session est ouverte, si elle n'administre pas déjà. -->
      <a
        class="nav-link"
        *ngIf="auth.isAuthenticated() && !auth.canAdminister()"
        routerLink="/web/mes-evenements">
        Mes événements
      </a>
      <!-- L'annuaire n'existe que pour les groupes auxquels le module est attribué. -->
      <a
        class="nav-link"
        *ngIf="auth.canSeeMembers() && !auth.canAdminister()"
        routerLink="/web/membres">
        Membres
      </a>

      <div class="topbar-actions-mobile">
        <a class="ghost" *ngIf="!auth.isAuthenticated()" routerLink="/login">Se connecter</a>
        <ng-container *ngIf="auth.isAuthenticated()">
          <a class="ghost" routerLink="/web/profil">Mon profil</a>
          <button type="button" class="ghost" (click)="signOut()">Se déconnecter</button>
        </ng-container>
        <a class="cta" routerLink="/web/creer-un-evenement">Créer un événement</a>
      </div>
    </nav>

    <div class="topbar-actions">
      <a class="ghost" *ngIf="!auth.isAuthenticated()" routerLink="/login">Se connecter</a>

      <!-- Session ouverte : le nom et le rôle ouvrent le menu du compte -->
      <div class="account" #accountMenu *ngIf="auth.isAuthenticated()">
        <button
          type="button"
          class="account-trigger"
          (click)="toggleAccountMenu()"
          [attr.aria-expanded]="accountMenuOpen"
          title="Mon compte">
          <span class="account-avatar">{{ initials }}</span>
          <i class="pi" [ngClass]="accountMenuOpen ? 'pi-chevron-up' : 'pi-chevron-down'"></i>
        </button>

        <div class="account-dropdown" *ngIf="accountMenuOpen">
          <div class="account-identity">
            <strong>{{ userName }}</strong>
            <small>{{ roleLabel }}</small>
          </div>

          <!-- Un administrateur retrouve déjà ces deux entrées dans Mon espace
               (visible dans la barre) ; inutile de les répéter ici pour lui. -->
          <ng-container *ngIf="!auth.canAdminister()">
            <a class="account-item" routerLink="/web/mes-evenements" (click)="accountMenuOpen = false">
              <i class="pi pi-calendar"></i> Mes événements
            </a>
            <a
              class="account-item"
              *ngIf="auth.canSeeMembers()"
              routerLink="/web/membres"
              (click)="accountMenuOpen = false">
              <i class="pi pi-users"></i> Membres
            </a>

            <div class="account-divider"></div>
          </ng-container>

          <a class="account-item" routerLink="/web/profil" (click)="accountMenuOpen = false">
            <i class="pi pi-user"></i> Mon profil
          </a>
          <!-- Un administrateur a déjà son groupe ; inutile de lui proposer d'en demander un. -->
          <a
            class="account-item"
            *ngIf="!auth.canAdminister()"
            routerLink="/web/creer-un-groupe"
            (click)="accountMenuOpen = false">
            <i class="pi pi-sitemap"></i> Créer ma communauté
          </a>
          <button type="button" class="account-item" (click)="signOut()">
            <i class="pi pi-sign-out"></i> Se déconnecter
          </button>
        </div>
      </div>

      <a class="cta" routerLink="/web/creer-un-evenement">
        Créer un événement
        <i class="pi pi-arrow-up-right"></i>
      </a>
    </div>

    <button class="burger" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen" aria-label="Menu">
      <i class="pi" [class.pi-bars]="!menuOpen" [class.pi-times]="menuOpen"></i>
    </button>
  </div>
</header>
