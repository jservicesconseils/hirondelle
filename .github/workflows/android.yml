name: Build Android

# Déclenchement manuel depuis l'onglet Actions, et à chaque poussée sur main
# qui touche le code du frontend/Capacitor.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'roseedhermon-ui-ng/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roseedhermon-ui-ng

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: roseedhermon-ui-ng/package-lock.json

      # AGP 8.7 exige Java 17 ou plus.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: Build web de production
        run: npm run build:web

      - name: Synchronisation Capacitor
        run: npx cap sync android

      - name: Compilation de l'APK de débogage
        working-directory: roseedhermon-ui-ng/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: roseedhermon-ui-ng/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Paquet signé pour Google Play. Ne s'exécute que si les secrets de signature
  # existent : ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
  # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: roseedhermon-ui-ng

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: roseedhermon-ui-ng/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci
      - run: npm run build:web
      - run: npx cap sync android

      - name: Restauration du magasin de clés
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Compilation du bundle
        working-directory: roseedhermon-ui-ng/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: roseedhermon-ui-ng/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
