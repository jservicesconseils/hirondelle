name: Deploy frontend to S3 + CloudFront

on:
  push:
    branches: [ main ]
    paths:
      - 'roseedhermon-ui-ng/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd roseedhermon-ui-ng
          npm ci

      - name: Build production bundle
        run: |
          cd roseedhermon-ui-ng
          npm run build:web

      - name: Validate AWS secrets
        run: |
          if [ "${{ secrets.AWS_ACCESS_KEY_ID }}" = "" ] || \
             [ "${{ secrets.AWS_SECRET_ACCESS_KEY }}" = "" ] || \
             [ "${{ secrets.AWS_REGION }}" = "" ] || \
             [ "${{ secrets.S3_BUCKET_NAME }}" = "" ]; then

            echo "Missing required AWS secrets. Check Settings > Secrets and variables > Actions > Secrets:"
            [ "${{ secrets.AWS_ACCESS_KEY_ID }}" = "" ] && echo "- AWS_ACCESS_KEY_ID is empty"
            [ "${{ secrets.AWS_SECRET_ACCESS_KEY }}" = "" ] && echo "- AWS_SECRET_ACCESS_KEY is empty"
            [ "${{ secrets.AWS_REGION }}" = "" ] && echo "- AWS_REGION is empty"
            [ "${{ secrets.S3_BUCKET_NAME }}" = "" ] && echo "- S3_BUCKET_NAME is empty"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        env:
          AWS_S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws s3 sync roseedhermon-ui-ng/dist/sakai-ng/browser/ s3://$AWS_S3_BUCKET/ --delete --region $AWS_REGION

      - name: Create CloudFront invalidation
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths '/*'
