name: Deploy backend to ECS (Fargate)

on:
  push:
    branches: [ main ]

jobs:
  test:
    name: Test (typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install and typecheck backend
        run: |
          cd roseedhermon-services-node
          npm ci
          npm run typecheck

  build:
    name: Build image and push to ECR
    needs: test
    runs-on: ubuntu-latest
    environment: production
    outputs:
      IMAGE_URI: ${{ steps.push-image.outputs.IMAGE_URI }}
      IMAGE_TAG: ${{ steps.push-image.outputs.IMAGE_TAG }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate AWS secrets
        run: |
          if [ "${{ secrets.AWS_ACCESS_KEY_ID }}" = "" ] || [ "${{ secrets.AWS_SECRET_ACCESS_KEY }}" = "" ] || [ "${{ secrets.AWS_REGION }}" = "" ]; then
            echo "Missing required AWS secrets. Please set AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and AWS_REGION in repository secrets." >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ca-central-1' }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Create ECR repository if missing
        run: |
          aws ecr describe-repositories --repository-names "${{ secrets.ECR_REPOSITORY }}" || aws ecr create-repository --repository-name "${{ secrets.ECR_REPOSITORY }}"

      - name: Build, tag and push image
        id: push-image
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION || 'ca-central-1' }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd roseedhermon-services-node
          docker build -t $ECR_REGISTRY/${{ secrets.ECR_REPOSITORY }}:$IMAGE_TAG .
          docker push $ECR_REGISTRY/${{ secrets.ECR_REPOSITORY }}:$IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "IMAGE_URI=$ECR_REGISTRY/${{ secrets.ECR_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to ECS Fargate
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate AWS secrets
        run: |
          if [ "${{ secrets.AWS_ACCESS_KEY_ID }}" = "" ] || [ "${{ secrets.AWS_SECRET_ACCESS_KEY }}" = "" ] || [ "${{ secrets.AWS_REGION }}" = "" ]; then
            echo "Missing required AWS secrets. Please set AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and AWS_REGION in repository secrets." >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ca-central-1' }}

      - name: Deploy to ECS Fargate
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'ca-central-1' }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ needs.build.outputs.IMAGE_TAG }}
          IMAGE_URI: ${{ needs.build.outputs.IMAGE_URI }}
          ECS_CLUSTER_NAME: ${{ secrets.ECS_CLUSTER_NAME }}
          ECS_SERVICE_NAME: ${{ secrets.ECS_SERVICE_NAME }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          COGNITO_REGION: ${{ secrets.COGNITO_REGION }}
        run: |
          bash ./scripts/deploy_ecs.sh
