name: One-off Cognito setup

# Manual, one-shot provisioning of the Hirondelle Cognito user pool.
#
# The AWS console's guided "create user pool" wizard doesn't expose custom
# attributes, but `custom:groupId` is required by the backend (see
# roseedhermon-services-node/src/common/security.ts) to scope GROUP_ADMIN and
# MEMBER accounts to their group. The CLI has no such limitation, so this
# workflow does it once via `aws cognito-idp`.
#
# Safe to re-run: it skips creation if a pool with POOL_NAME already exists.

on:
  workflow_dispatch: {}

jobs:
  create-pool:
    name: Create Cognito user pool
    runs-on: ubuntu-latest
    environment: deployer_aws_prod

    env:
      AWS_REGION: us-east-1
      POOL_NAME: hirondelle-users
      CLIENT_NAME: hirondelle-web

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Create user pool, app client and role groups
        run: |
          set -euo pipefail

          echo "Looking for an existing pool named '$POOL_NAME'..."

          EXISTING_ID=$(
            aws cognito-idp list-user-pools --max-results 60 \
              --query "UserPools[?Name=='$POOL_NAME'].Id | [0]" \
              --output text
          )

          if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "None" ]; then
            echo "Pool already exists: $EXISTING_ID"
            POOL_ID="$EXISTING_ID"
          else
            echo "Creating user pool '$POOL_NAME'..."

            POOL_ID=$(
              aws cognito-idp create-user-pool \
                --pool-name "$POOL_NAME" \
                --username-attributes email \
                --auto-verified-attributes email \
                --admin-create-user-config AllowAdminCreateUserOnly=true \
                --schema '[
                  {"Name":"email","AttributeDataType":"String","Required":true,"Mutable":true},
                  {"Name":"groupId","AttributeDataType":"String","Mutable":true,"Required":false}
                ]' \
                --query "UserPool.Id" \
                --output text
            )

            echo "Created pool: $POOL_ID"
          fi

          echo "Looking for an existing app client named '$CLIENT_NAME'..."

          EXISTING_CLIENT_ID=$(
            aws cognito-idp list-user-pool-clients --user-pool-id "$POOL_ID" \
              --query "UserPoolClients[?ClientName=='$CLIENT_NAME'].ClientId | [0]" \
              --output text
          )

          if [ -n "$EXISTING_CLIENT_ID" ] && [ "$EXISTING_CLIENT_ID" != "None" ]; then
            echo "App client already exists: $EXISTING_CLIENT_ID"
            CLIENT_ID="$EXISTING_CLIENT_ID"
          else
            echo "Creating app client '$CLIENT_NAME'..."

            CLIENT_ID=$(
              aws cognito-idp create-user-pool-client \
                --user-pool-id "$POOL_ID" \
                --client-name "$CLIENT_NAME" \
                --no-generate-secret \
                --explicit-auth-flows ALLOW_USER_SRP_AUTH ALLOW_USER_PASSWORD_AUTH ALLOW_REFRESH_TOKEN_AUTH \
                --query "UserPoolClient.ClientId" \
                --output text
            )

            echo "Created app client: $CLIENT_ID"
          fi

          echo "Enabling self-service sign-up..."

          # The pool was created with admin-only user creation (matching a
          # closed, invite-only app). Public event creation now needs anyone
          # to be able to open their own (groupless) account, so this flips
          # that back open. Safe to re-run: it's a plain idempotent update.
          aws cognito-idp update-user-pool \
            --user-pool-id "$POOL_ID" \
            --admin-create-user-config AllowAdminCreateUserOnly=false \
            --region "$AWS_REGION" \
            >/dev/null

          for GROUP in SUPER_ADMIN GROUP_ADMIN MEMBER; do
            if aws cognito-idp get-group --user-pool-id "$POOL_ID" --group-name "$GROUP" >/dev/null 2>&1; then
              echo "Group $GROUP already exists."
            else
              echo "Creating group $GROUP..."
              aws cognito-idp create-group --user-pool-id "$POOL_ID" --group-name "$GROUP" >/dev/null
            fi
          done

          {
            echo "## Cognito setup complete"
            echo ""
            echo "| Value | |"
            echo "|---|---|"
            echo "| Region | \`$AWS_REGION\` |"
            echo "| User Pool ID | \`$POOL_ID\` |"
            echo "| App Client ID | \`$CLIENT_ID\` |"
            echo ""
            echo "Groups: SUPER_ADMIN, GROUP_ADMIN, MEMBER"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "========================================"
          echo "POOL_ID=$POOL_ID"
          echo "CLIENT_ID=$CLIENT_ID"
          echo "REGION=$AWS_REGION"
          echo "========================================"
