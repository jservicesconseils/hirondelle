name: Build iOS

# Capacitor 7 exige Xcode 16, qui réclame macOS 14 ou plus. Le MacBook Pro de 2015
# du projet plafonne à macOS 12 : la compilation iOS se fait donc ici, sur un
# exécuteur macOS fourni par GitHub.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: roseedhermon-ui-ng

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: roseedhermon-ui-ng/package-lock.json

      # L'image macos-15 fournit Xcode 16 par défaut ; on trace la version
      # utilisée pour que tout écart soit visible dans le journal.
      - name: Version de Xcode
        run: xcodebuild -version

      - run: npm ci

      - name: Build web de production
        run: npm run build:web

      # « cap sync » lance lui-même « pod install » : CocoaPods est préinstallé
      # sur les exécuteurs macOS de GitHub.
      - name: Synchronisation Capacitor
        run: npx cap sync ios

      # Archive non signée : elle prouve que le projet compile. La production d'un
      # .ipa distribuable demande un certificat et un profil de provisionnement,
      # à déposer en secrets du dépôt (voir le bloc commenté plus bas).
      - name: Archive iOS (sans signature)
        working-directory: roseedhermon-ui-ng/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - uses: actions/upload-artifact@v4
        with:
          name: App-unsigned-xcarchive
          path: ${{ runner.temp }}/App.xcarchive
          if-no-files-found: error

# Pour produire un .ipa signé et l'envoyer à TestFlight, ajouter les secrets
# suivants au dépôt, puis remplacer l'étape d'archive ci-dessus :
#
#   IOS_CERTIFICATE_BASE64        certificat de distribution (.p12) encodé en base64
#   IOS_CERTIFICATE_PASSWORD      mot de passe du .p12
#   IOS_PROVISIONING_PROFILE_BASE64  profil de provisionnement encodé en base64
#   APPSTORE_ISSUER_ID / APPSTORE_KEY_ID / APPSTORE_PRIVATE_KEY
#                                 clé App Store Connect pour l'envoi
#
# Ces éléments viennent du compte Apple Developer (99 $ US par an), qui est
# indispensable à toute distribution, y compris en test interne.
