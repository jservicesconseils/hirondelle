<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Reminder</title>
</head>
<body>
    <h1>Reminder for Your Upcoming Event</h1>
    <p>Dear {{userName}},</p>
    <p>This is a reminder for the event <strong>{{eventName}}</strong> scheduled on <strong>{{eventDate}}</strong> at <strong>{{eventLocation}}</strong>.</p>
    <p>We hope to see you there!</p>
    <p>Best regards,<br>Your Event Management Team</p>
</body>
</html>
