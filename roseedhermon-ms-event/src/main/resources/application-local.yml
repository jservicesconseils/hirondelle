# Configuration locale pour MongoDB local
# Utiliser avec: SPRING_PROFILES_ACTIVE=local mvn spring-boot:run

server:
  port: 8081
  ssl:
    enabled: false

spring:
  application:
    name: ms-event
  data:
    mongodb:
      # MongoDB local (sans authentification)
      uri: mongodb://localhost:27017/db_rdh
      database: db_rdh
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# Configuration des fichiers
app:
  file:
    upload-dir: uploads/events
    max-size: 10485760  # 10MB en bytes
    allowed-types: image/jpeg,image/jpg,image/png,image/gif,image/webp,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,video/mp4,audio/mpeg


